<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PACE Fixture Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* PACE [Brand & Slide] — tokens audited from the Figma brand file.
   One accent (orange), Archivo Black display, 20px radius.
   Dark is the brand default; light is a derived mode behind the header toggle. */
:root{
  --pace-orange:#fd6632;
  --pace-dark-blue:#031119;
  --pace-sidebar-bg:#1f2c33;
  --pace-graphite:#1C2327;            /* lifted field — black was crushing the card edges */

  /* Inverted from v4: the field is graphite and the cards carry the brand blue.
     At 50% the card fill can only reach ~1.2:1 against the field, so the card
     BOUNDARY does the separating — hence --line-card, and hence the lift off black,
     which took the same border from 1.44:1 to 2.9:1. */
  --bg:var(--pace-graphite);
  --surface:rgba(3,17,25,.50);        /* card fill: PACE dark blue, 50% — reads as a recess */
  --chrome:rgba(3,17,25,.96);         /* header + tab strip — must occlude scrolling content */
  --ink:#FFFFFF;
  --band-ink:#FFFFFF;
  --muted:rgba(255,255,255,.62);
  --neutral-text:rgba(255,255,255,.80);
  --line:rgba(255,255,255,.20);       /* internal hairlines, row dividers */
  --line-card:rgba(255,255,255,.32);  /* outer edge of a card/panel/list — ~2.9:1 */
  --line-strong:rgba(255,255,255,.38);
  --lift-1:rgba(255,255,255,.05);     /* day strips, hovers, segment track */
  --lift-2:rgba(255,255,255,.15);     /* neutral chips */
  --glow-1:rgba(253,102,50,.30);
  --glow-2:rgba(253,102,50,.14);

  --accent:var(--pace-orange);        /* fills, rules, indicators */
  --accent-text:var(--pace-orange);   /* accent as type */
  --accent-ink:var(--pace-dark-blue); /* type on an accent fill */
  --warn:var(--accent-text);
  --live:var(--pace-orange);
  --w:var(--pace-orange);
  --m:rgba(255,255,255,.80);

  --radius-card:20px;
  --tabs-h:49px;                      /* height of the sticky tournament strip */
  --font-display:"Archivo Black","Archivo",system-ui,sans-serif;
  --font-head:"Archivo",system-ui,sans-serif;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  --bg:#E9EDEF;
  --surface:rgba(255,255,255,.72);
  --chrome:rgba(255,255,255,.94);
  --ink:var(--pace-dark-blue);
  --band-ink:var(--pace-dark-blue);
  --muted:rgba(3,17,25,.62);
  --neutral-text:rgba(3,17,25,.72);
  --line:rgba(3,17,25,.14);
  --line-card:rgba(3,17,25,.22);
  --line-strong:rgba(3,17,25,.30);
  --lift-1:rgba(3,17,25,.05);
  --lift-2:rgba(3,17,25,.11);
  --glow-1:rgba(253,102,50,.20);
  --glow-2:rgba(253,102,50,.10);
  /* #fd6632 as type on a light field is ~2.4:1, so accent TYPE darkens while
     accent FILLS stay the exact brand orange. */
  --accent-text:#9A3410;
  --m:rgba(3,17,25,.72);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70vw 60vh at 88% 104%, var(--glow-1), transparent 62%),
    radial-gradient(48vw 42vh at 104% 62%, var(--glow-2), transparent 66%),
    var(--bg);}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{background:var(--chrome);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.head{max-width:1120px;margin:0 auto;padding:22px 20px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0 0 8px;font-family:var(--font);font-size:.76rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);opacity:1}
h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(1.55rem,3.8vw,2.6rem);line-height:1;letter-spacing:-0.02em;text-transform:uppercase}
.sub{margin:10px 0 0;font-family:var(--font-head);opacity:.72;font-size:.95rem}
.brand{font-family:var(--font-display);font-weight:900;font-size:1.05rem;letter-spacing:.02em;text-transform:uppercase;line-height:1;margin:0 0 14px;display:flex;gap:.5ch}
.brand span{color:var(--accent-text)}
.headright{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-left:auto}
.themebtn{background:var(--lift-1);border:1.5px solid var(--line);color:var(--muted);border-radius:999px;
  padding:8px 16px;font-family:var(--font);font-weight:700;font-size:.76rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.themebtn:hover{color:var(--ink);border-color:var(--line-strong)}
.themebtn svg{width:15px;height:15px;flex:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--lift-1)}
.seg button{background:none;border:0;border-radius:999px;padding:7px 18px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[hidden],[hidden]{display:none}
.back{background:none;border:0;padding:6px 0;margin:0 0 8px;font-weight:700;font-size:.88rem;cursor:pointer;opacity:.75}

.tabs{background:var(--chrome);color:var(--ink);border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:20}
@supports not ((backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px))){
  .tabs{background:var(--bg)}
}
.tabs .inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.drag-scroll{scrollbar-width:none;-ms-overflow-style:none;cursor:grab;overscroll-behavior-x:contain}
.drag-scroll::-webkit-scrollbar{display:none}
.drag-scroll.dragging{cursor:grabbing;user-select:none}
.drag-scroll.dragging button{cursor:grabbing}
.tabs .inner.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 56px),transparent)}
.tabs .inner.more-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 56px);mask-image:linear-gradient(to right,transparent,#000 56px)}
.tabs .inner.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 56px),transparent)}
.tabs button{background:none;border:0;padding:13px 14px;font-family:var(--font-display);font-weight:900;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;opacity:.6}
.tabs button[aria-pressed="true"]{opacity:1;color:var(--accent-text);border-bottom-color:var(--accent)}

main.page{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:32px;padding:28px 20px 60px;max-width:1120px;margin:0 auto}
nav.side{position:sticky;top:calc(var(--tabs-h) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - var(--tabs-h) - 32px);overflow:auto}
nav.side button{background:none;border:0;text-align:left;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:500;border-left:3px solid transparent;color:var(--muted)}
nav.side button small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
nav.side button:hover{background:var(--lift-1);color:var(--ink)}
nav.side button[aria-pressed="true"]{background:var(--surface);border-left-color:var(--accent);color:var(--ink)}
nav.side .all{margin-top:10px;color:var(--muted);font-weight:500}

/* dashboard */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line-card);border-radius:var(--radius-card);padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;font:inherit;line-height:1.45;color:inherit;min-width:0}
.card>*{margin:0}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card:hover{border-color:var(--accent)}
.card{transition:border-color .15s ease}
.card h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.1rem;line-height:1.12;letter-spacing:-0.01em;text-transform:uppercase}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.card dt{color:var(--muted)}
.card dd{margin:0}
.pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:999px;border:1.5px solid currentColor;width:max-content}
.pill.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.soon{color:var(--accent-text)}
.pill.done{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill.stage{color:var(--neutral-text)}
.pill.stage.inline{margin-left:6px;vertical-align:1px;font-size:.62rem;padding:2px 9px}
.state{font-size:.86rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--accent)}

/* tournament overview */
.panel{background:var(--surface);border:1px solid var(--line-card);border-radius:var(--radius-card);padding:24px;margin-bottom:20px}
.panel h3{margin:0 0 16px;font-family:var(--font-display);font-weight:900;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.facts{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 28px}
.facts div{min-width:0}
.facts dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.facts dd{margin:2px 0 0}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}
.check{list-style:none;margin:0;padding:0}
.check li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.check b{font-weight:700}
.check small{display:block;color:var(--muted);font-size:.86rem}
.mark{font-weight:900;color:var(--muted)}
.mark.on{color:var(--accent-text)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.groups h4{margin:0 0 6px;font-family:var(--font-display);font-weight:900;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.groups ol{margin:0;padding-left:18px}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius-card);padding:30px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-weight:900;font-size:1.05rem;letter-spacing:-0.01em;text-transform:uppercase;margin-bottom:8px}

/* fixture lists */
section.block{margin-bottom:48px;scroll-margin-top:calc(var(--tabs-h) + 16px)}
section.block h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(1.35rem,3.2vw,2.05rem);line-height:1;letter-spacing:-0.02em;text-transform:uppercase}
.meta{color:var(--muted);margin:6px 0 16px;font-size:.92rem}
.list{background:var(--surface);border:1px solid var(--line-card);border-radius:var(--radius-card);overflow:hidden}
.row{display:grid;grid-template-columns:44px 118px 70px 64px minmax(0,1fr) 104px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rnd{font-family:var(--font-display);font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.92rem}
.date b{font-weight:700}
.ko{font-variant-numeric:tabular-nums;font-weight:600}
.ha{display:inline-block;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 0;border-radius:999px;width:58px}
.ha.home{background:var(--lift-2);color:var(--ink)}
.ha.away{border:1.5px solid var(--line-strong);color:var(--muted)}
.opp{font-weight:700}
.opp small,.match small{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
.flag{color:var(--warn)}
.row.bye{opacity:.6}
.row.bye .opp{font-weight:500;font-style:italic}
.row.final{background:rgba(253,102,50,.12);box-shadow:inset 3px 0 0 var(--accent);color:var(--ink)}
.row.final .rnd,.row.final .opp small,.row.final .match small{color:inherit;opacity:.75}
.kom{display:none}
.day{padding:11px 16px;font-family:var(--font-display);font-weight:900;font-size:.9rem;letter-spacing:.02em;text-transform:uppercase;border-top:1px solid var(--line);background:var(--lift-1)}
.day:first-child{border-top:0}
.wrow{display:grid;grid-template-columns:60px minmax(0,104px) minmax(0,1fr) 104px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.wrow.notag{grid-template-columns:60px minmax(0,1fr) 104px}
.wrow>*{min-width:0}
.tag{display:inline-block;font-size:.76rem;font-weight:700;line-height:1.25;padding:2px 8px;border-radius:12px;border:1.5px solid currentColor;text-align:center;max-width:100%;overflow-wrap:anywhere}
.tag.W{color:var(--accent-text)}
.tag.M{color:var(--neutral-text)}
.match{font-weight:700;overflow-wrap:anywhere}
.match .v{font-weight:400;color:var(--muted);margin:0 6px}
.sc{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-variant-numeric:tabular-nums;padding-left:12px;border-left:1px solid var(--line);align-self:stretch}
.sc.none{color:var(--muted);opacity:.55;font-weight:700}
.scv{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.scv b{font-family:var(--font-display);font-weight:900;font-size:1.3rem;letter-spacing:-0.03em}
.scv small{margin-top:4px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.res{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:.74rem;flex:none}
.res.W{background:var(--accent);color:var(--accent-ink)}
.res.D{border:1.5px solid var(--muted);color:var(--muted)}
.res.L{background:var(--lift-2);color:var(--muted)}
.sc.none.await{font-family:var(--font);font-weight:700;font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent-text);opacity:.9}
.stamp{margin:6px 0 0;font-size:.76rem;color:var(--muted)}
.stamp b{font-weight:700;color:var(--neutral-text)}
.stamp .warn{color:var(--accent-text);font-weight:700}
.row.final .sc,.row.bye .sc{border-left:0}
.byes{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.foot{color:var(--muted);font-size:.85rem;margin-top:8px}

@media (max-width:760px){
  .headright{margin-left:0;justify-content:flex-start;width:100%}
  .layout{grid-template-columns:1fr;gap:18px;padding-top:16px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;max-height:none}
  nav.side button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;background:var(--lift-1);border-radius:10px}
  nav.side button[aria-pressed="true"]{border-bottom-color:var(--accent)}
  nav.side .all{margin-top:0}
  .row{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"r d h" "r o s";row-gap:4px}
  .row .sc{grid-area:s;border-left:0;padding-left:0}
  .rnd{grid-area:r;align-self:start}
  .date{grid-area:d} .ko{display:none} .date .kom{display:inline}
  .ha{grid-area:h} .opp{grid-area:o}
  .wrow{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"k t s" "m m s";row-gap:4px}
  .wrow.notag{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"k . s" "m m s";row-gap:4px}
  .wrow .sc{grid-area:s;border-left:0}
  .wrow .ko{display:block;grid-area:k} .wrow .tagc{grid-area:t} .wrow .match{grid-area:m}
}
@media print{
  html{scroll-behavior:auto}
  .controls,nav.side,.tabs,.back,.themebtn{display:none}
  .layout{grid-template-columns:1fr}
  section.block{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="head">
    <div>
      <p class="brand">PACE<span>Fixtures</span></p>
      <button class="back" id="back" hidden>← All tournaments</button>
      <p class="eyebrow" id="eyebrow">Fixture hub</p>
      <h1 id="title">Tournament fixture hub</h1>
      <p class="sub" id="sub">Schedules, fixture data and Figma rollout status</p>
      <p class="stamp" id="stamp" hidden></p>
    </div>
    <div class="headright">
      <div class="controls" id="controls" hidden></div>
      <button class="themebtn" id="theme" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
        </svg><span id="themelabel">Light</span>
      </button>
    </div>
  </div>
</header>
<div class="tabs"><div class="inner drag-scroll" id="tabs"></div></div>
<div id="app"></div>

   we genuinely cannot tell which matchday it is on, and a guess here would be
   read as fact. */
function currentStage(t){
  if(t.id==="nzl"){
    const next=["W","M"].flatMap(c=>(DATA[c]||[])
        .filter(g=>!g.bye&&g.d&&!g._started&&!g.s)
        .map(g=>({round:g.r,key:g.d.split("/").reverse().join("")})))
      .sort((a,b)=>a.key.localeCompare(b.key))[0];
    return next?`Round ${next.round}`:null;
  }
  const list=FIX[t.id]||[];
  if(!list.length) return null;
  if(!list.some(x=>x.date)) return null;
  const pending=list.find(x=>!x._started&&!x.score);
  return pending&&pending.stage?pending.stage:null;
}

/* ---------- dashboard ---------- */

        stage?`<span class="pill stage">${esc(stage)}</span>`:""}</div>
      <h3>${esc(t.name)}</h3>
      <dl>
        <dt>Dates</dt><dd>${esc(t.window)}</dd>

      <span class="state"><span class="dot ${t.dataLoaded?"on":""}"></span>${t.dataLoaded?"Fixture data loaded":"No fixture data yet"}</span>
    </div>`;

  return `<main class="page"><div class="cards">${cards}</div>
    <p class="foot">Each tournament opens its own page: fixture lists where the schedule is loaded, and the Figma rollout status either way.</p></main>`;

function emptyState(t){

    Send the official match schedule for ${esc(t.short)} and this page fills in with the same team and week views as the National League, plus a CSV ready for the Figma agent.</div>`;

/* ---------- fixture views (NZ) ---------- */
function teamsOf(c){
  const s=new Set(); DATA[c].forEach(x=> x.bye ? s.add(x.bye) : (s.add(x.h), s.add(x.a)));
  return [...s].sort();
}
function teamBlock(c,t){
  const rows=DATA[c].filter(x=>x.bye===t||x.h===t||x.a===t).sort((a,b)=>a.r-b.r);
  const games=rows.filter(x=>!x.bye), home=games.filter(x=>x.h===t).length;
  let html=`<section class="block"><h2>${esc(t)}</h2>
  <p class="meta">${games.length} matches, ${home} home and ${games.length-home} away, plus 1 bye${recordLine(games.map(x=>({score:x.s,pens:x.p,isHome:x.h===t})))}</p><div class="list">`;
  rows.forEach(x=>{
    if(x.bye){html+=`<div class="row bye"><div class="rnd">R${x.r}</div><div class="date">No match</div><div class="ko"></div><div></div><div class="opp">Bye round</div></div>`;return;}
    const isHome=x.h===t, opp=isHome?x.a:x.h, dt=toDate(x.d);
    html+=`<div class="row"><div class="rnd">R${x.r}</div>
      <div class="date"><b>${DAYS[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}</b><span class="kom"> ${x.t}</span></div>
      <div class="ko">${x.t}</div>
      <div><span class="ha ${isHome?"home":"away"}">${isHome?"Home":"Away"}</span></div>
      <div class="opp">${isHome?"vs":"at"} ${esc(opp)}<small>${venueTxt(c,x)}</small></div>${scoreCell(x.s,x.p,outcome(x.s,x.p,isHome),x._started)}</div>`;
  });
  html+=`<div class="row final"><div class="rnd">R${FINAL[c]}</div><div class="date"><b>Date TBC</b></div><div class="ko">TBC</div><div></div><div class="opp">Final: 1st vs 2nd<small>If qualified. Venue TBC</small></div></div>`;
  return html+`</div></section>`;
}
function weekKey(dt){const m=new Date(dt);m.setDate(dt.getDate()-((dt.getDay()+6)%7));return m.getTime();}
function buildWeeks(comps){
  const map=new Map();
  comps.forEach(c=>DATA[c].forEach(x=>{if(!x.bye){const dt=toDate(x.d),k=weekKey(dt);if(!map.has(k))map.set(k,{games:[],rounds:new Set()});const w=map.get(k);w.games.push({...x,c,dt});w.rounds.add(c+x.r);}}));
  return [...map.entries()].sort((a,b)=>a[0]-b[0]).map(([k,w],i)=>{
    w.n=i+1; w.games.sort((a,b)=>a.dt-b.dt||a.t.localeCompare(b.t)||a.c.localeCompare(b.c));
    w.byes=[]; comps.forEach(c=>DATA[c].forEach(x=>{if(x.bye&&w.rounds.has(c+x.r))w.byes.push({c,team:x.bye});}));
    const f=w.games[0].dt,l=w.games[w.games.length-1].dt;
    w.range= f.getTime()===l.getTime()? `${f.getDate()} ${MON[f.getMonth()]}` : (f.getMonth()===l.getMonth()?`${f.getDate()}–${l.getDate()} ${MON[l.getMonth()]}`:`${f.getDate()} ${MON[f.getMonth()]} – ${l.getDate()} ${MON[l.getMonth()]}`);
    return w;
  });
}
function weekBlock(w,comps){
  const both=comps.length>1;
  const counts=comps.map(c=>{const n=w.games.filter(g=>g.c===c).length;return n?`${n} ${NAME[c].toLowerCase()}'s`:null}).filter(Boolean);
  const rounds=comps.map(c=>{const r=[...new Set(w.games.filter(g=>g.c===c).map(g=>g.r))];return r.length?`${NAME[c]} round ${r.join(", ")}`:null}).filter(Boolean);
  let html=`<section class="block" id="week-${w.n}"><h2>Week ${w.n}, ${w.range}</h2>
    <p class="meta">${rounds.join(", ")}. ${w.games.length} matches${both?` (${counts.join(", ")})`:""}</p><div class="list">`;
  let day=null;
  w.games.forEach(g=>{
    const ds=g.dt.getTime();
    if(ds!==day){day=ds;html+=`<div class="day">${DAYL[g.dt.getDay()]} ${g.dt.getDate()} ${MONL[g.dt.getMonth()]}</div>`;}
    html+=`<div class="wrow"><div class="ko">${g.t}</div><div class="tagc"><span class="tag ${g.c}">${NAME[g.c]}</span></div>
      <div class="match">${esc(g.h)}<span class="v">v</span>${esc(g.a)}<small>${venueTxt(g.c,g)}</small></div>${scoreCell(g.s,g.p,null,g._started)}</div>`;
  });
  if(w.byes.length) html+=`<div class="byes">Bye: ${w.byes.map(b=>esc(b.team)+(both?` (${NAME[b.c].toLowerCase()})`:"")).join(", ")}</div>`;
  return html+`</div></section>`;
}
function finalsBlock(comps){
  return `<section class="block" id="week-finals"><h2>Finals</h2><p class="meta">Dates and venues to be confirmed</p><div class="list">`+
    comps.map(c=>`<div class="row final" style="grid-template-columns:60px 78px 1fr"><div class="ko">TBC</div><div><span class="tag" style="color:inherit">${NAME[c]}</span></div><div class="match">First place<span class="v" style="color:inherit;opacity:.7">v</span>Second place<small>${NAME[c]} round ${FINAL[c]}. Venue TBC</small></div></div>`).join("")+`</div></section>`;
}



/* ---------- results ---------- */
function parseScore(s){ const m=String(s||"").match(/(\d+)\s*[–-]\s*(\d+)/); return m?[+m[1],+m[2]]:null; }
function outcome(score,pens,isHome){
  const sc=parseScore(score); if(!sc) return null;
  let [h,a]=sc;
  if(h===a && pens){ const p=parseScore(pens); if(p){ h=p[0]; a=p[1]; } }
  if(h===a) return "D";
  return (h>a)===isHome ? "W" : "L";
}
function scoreCell(score,pens,res,started){
  if(!score) return started
    ? `<div class="sc none await" title="Kick-off has passed and no result has been recorded">awaiting</div>`
    : `<div class="sc none" title="Not played yet">–</div>`;
  return `<div class="sc">${res?`<span class="res ${res}" title="${{W:"Win",D:"Draw",L:"Loss"}[res]}">${res}</span>`:""}<span class="scv"><b>${esc(score)}</b><small>${pens?esc(pens)+" pens":"FT"}</small></span></div>`;
}
function recordLine(games){
  // games: [{score,pens,isHome}]
  const done=games.filter(g=>parseScore(g.score));
  if(!done.length) return "";
  let w=0,d=0,l=0,gf=0,ga=0;
  done.forEach(g=>{ const [h,a]=parseScore(g.score); gf+=g.isHome?h:a; ga+=g.isHome?a:h;
    const r=outcome(g.score,g.pens,g.isHome); if(r==="W")w++; else if(r==="D")d++; else l++; });
  return `. Played ${done.length}: ${w}W ${d}D ${l}L, goals ${gf}–${ga}`;
}

/* ---------- generic tournament fixtures ---------- */
const ISO=d=>new Date(d+"T00:00:00");
const dLabel=d=>{const x=ISO(d);return `${DAYL[x.getDay()]} ${x.getDate()} ${MONL[x.getMonth()]}`};
const dShort=d=>{const x=ISO(d);return `${DAYS[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`};
function fixturesFor(t){
  let f=(FIX[t.id]||[]).slice();
  if(t.divisions && filt!=="all") f=f.filter(x=>x.division===filt);
  return f;
}
function genericTeams(t){
  const c={};
  (FIX[t.id]||[]).forEach(x=>{[x.home,x.away].forEach(n=>c[n]=(c[n]||0)+1)});
  return Object.keys(c).filter(n=>c[n]>1).sort();
}
function groupKey(x){ return x.date || x.stage; }
function genericByDate(t){
  const f=fixturesFor(t), keys=[];
  const map=new Map();
  f.forEach(x=>{const k=groupKey(x); if(!map.has(k)){map.set(k,[]);keys.push(k);} map.get(k).push(x);});
  const blocks=keys.map((k,i)=>{
    const list=map.get(k).slice().sort((a,b)=>(a.ko||"").localeCompare(b.ko||"")||a.no-b.no);
    const dated=!!list[0].date;
    const stages=[...new Set(list.map(x=>x.stage))];
    const showTag=list.some(x=>x.group)||stages.length>1;
    return `<section class="block" id="day-${i}"><h2>${esc(dated?dLabel(k):k)}</h2>
      <p class="meta">${esc(stages.join(", "))}. ${list.length} match${list.length>1?"es":""}${dated?"":". Date to be confirmed"}</p>
      <div class="list">${list.map(x=>`<div class="wrow${showTag?"":" notag"}"><div class="ko">${esc(x.ko||"TBC")}</div>
        ${showTag?`<div class="tagc"><span class="tag ${x.stage==="Group stage"||x.stage.startsWith("Matchday")?"W":"M"}">${esc(x.group||x.stage)}</span></div>`:""}
        <div class="match">${esc(x.home)}<span class="v">v</span>${esc(x.away)}<small>Match ${x.no}${x.division?", "+esc(x.division):""}. ${esc(x.venue)}${x.note?". "+esc(x.note):""}</small></div>${scoreCell(x.score,x.pens,null,x._started)}</div>`).join("")}</div></section>`;
  }).join("");
  const nav=keys.map((k,i)=>{
    const list=map.get(k);
    return `<button data-jump="day-${i}"><span>${esc(list[0].date?dShort(k):k)}</span><small>${list.length} match${list.length>1?"es":""}</small></button>`;
  }).join("");
  return {nav, body:blocks+`<p class="foot">All kick-off times are local. Schedules are subject to change.</p>`};
}
function genericByTeam(t){
  const teams=genericTeams(t), f=fixturesFor(t);
  const chosen=sel?[sel]:teams;
  const body=chosen.map(team=>{
    const rows=f.filter(x=>x.home===team||x.away===team).sort((a,b)=>(a.date||"9")>(b.date||"9")?1:-1||a.no-b.no);
    return `<section class="block"><h2>${esc(team)}</h2>
      <p class="meta">${rows.length} match${rows.length>1?"es":""} scheduled${rows[0]&&rows[0].group?", "+esc(rows[0].group):""}${recordLine(rows.map(x=>({score:x.score,pens:x.pens,isHome:x.home===team})))}</p>
      <div class="list">${rows.map(x=>{
        const opp=x.home===team?x.away:x.home;
        return `<div class="row"><div class="rnd">M${x.no}</div>
          <div class="date"><b>${x.date?esc(dShort(x.date)):"Date TBC"}</b><span class="kom"> ${esc(x.ko||"")}</span></div>
          <div class="ko">${esc(x.ko||"TBC")}</div>
          <div><span class="ha ${x.home===team?"home":"away"}">${x.home===team?"Listed 1st":"Listed 2nd"}</span></div>
          <div class="opp">v ${esc(opp)}<small>${esc(x.stage)}. ${esc(x.venue)}</small></div>${scoreCell(x.score,x.pens,outcome(x.score,x.pens,x.home===team),x._started)}</div>`;
      }).join("")}</div></section>`;
  }).join("");
  const nav=teams.map(x=>`<button data-team="${esc(x)}" aria-pressed="${sel===x}">${esc(x)}</button>`).join("")
    +`<button class="all" data-team="" aria-pressed="${sel===null}">All teams</button>`;
  return {nav, body:body+`<p class="foot">Neutral venues, so "listed 1st" is the schedule's first-named side, not a home team.</p>`};
}

/* ---------- render ---------- */
function renderTabs(){
  document.getElementById("tabs").innerHTML =
    `<button data-open="dash" aria-pressed="${route==="dash"}">Dashboard</button>`+
    TOURNAMENTS.map(t=>`<button data-open="${t.id}" aria-pressed="${route===t.id}">${esc(t.short)}</button>`).join("");
}
function controlsHTML(t){
  if(t.id==="nzl"){
    return `<div class="seg" role="group" aria-label="View">
        <button data-view="team" aria-pressed="${view==="team"}">By team</button>
        <button data-view="week" aria-pressed="${view==="week"}">By week</button>
      </div>
      <div class="seg" role="group" aria-label="Competition">
        <button data-comp="W" aria-pressed="${comp==="W"}">Women</button>
        <button data-comp="M" aria-pressed="${comp==="M"}">Men</button>
        ${view==="week"?`<button data-comp="B" aria-pressed="${comp==="B"}">Both</button>`:""}
      </div>`;
  }
  const teamView = t.teamView!==false;
  return `<div class="seg" role="group" aria-label="View">
      <button data-view="date" aria-pressed="${view!=="team"}">By date</button>
      ${teamView?`<button data-view="team" aria-pressed="${view==="team"}">By team</button>`:""}
    </div>`+
    (t.divisions?`<div class="seg" role="group" aria-label="Division">
      ${t.divisions.map(d=>`<button data-div="${esc(d)}" aria-pressed="${filt===d}">${esc(d)}</button>`).join("")}
      <button data-div="all" aria-pressed="${filt==="all"}">Both</button>
    </div>`:"");
}
function render(){
  const app=document.getElementById("app");
  const controls=document.getElementById("controls");
  const back=document.getElementById("back");
  renderTabs();
  if(route==="dash"){
    document.getElementById("eyebrow").textContent="Fixture hub";
    document.getElementById("title").textContent="Tournament fixture hub";
    document.getElementById("sub").textContent="Schedules, fixture data and Figma rollout status";
    controls.hidden=true; controls.innerHTML=""; back.hidden=false;
    back.hidden=true;
    app.innerHTML=dashboard();
    return;
  }
  const t=tOf(route);
  document.getElementById("eyebrow").textContent=t.badge;
  document.getElementById("title").textContent=t.name;
  document.getElementById("sub").textContent=`${t.window}. ${t.host}`;
  back.hidden=false;
  controls.hidden=!t.dataLoaded;
  controls.innerHTML=t.dataLoaded?controlsHTML(t):"";
  if(!t.dataLoaded){ app.innerHTML=`<main class="page">${overview(t)}${emptyState(t)}</main>`; return; }

  let side="", body="";
  if(t.id==="nzl"){
    if(view!=="week" && view!=="team") view="team";
    if(view==="team" && comp==="B") comp="W";
    if(view==="team"){
      const teams=teamsOf(comp);
      side=teams.map(x=>`<button data-team="${esc(x)}" aria-pressed="${sel===x}">${esc(x)}</button>`).join("")
        +`<button class="all" data-team="" aria-pressed="${sel===null}">All teams</button>`;
      body=(sel?[sel]:teams).map(x=>teamBlock(comp,x)).join("")
        +`<p class="foot">Times are local NZ kick-off times. Home matches marked in green.</p>`;
    } else {
      const comps = comp==="B" ? ["W","M"] : [comp];
      const weeks=buildWeeks(comps);
      side=weeks.map(w=>`<button data-jump="week-${w.n}"><span>Week ${w.n}</span><small>${w.range}</small></button>`).join("")
        +`<button data-jump="week-finals"><span>Finals</span><small>Dates TBC</small></button>`;
      body=weeks.map(w=>weekBlock(w,comps)).join("")+finalsBlock(comps)
        +`<p class="foot">Weeks run Monday to Sunday. Times are local NZ kick-off times.</p>`;
    }
  } else {
    const out = (view==="team" && t.teamView!==false) ? genericByTeam(t) : genericByDate(t);
    side=out.nav; body=out.body;
  }
  app.innerHTML=`<main class="page" style="padding-bottom:0">${overview(t)}</main>
    <div class="layout"><nav class="side drag-scroll" aria-label="Sections">${side}</nav><main>${body}</main></div>`;
}
function go(id){ route=id; sel=null; filt="all"; const t=tOf(id); view=(t&&t.id!=="nzl")?"date":"team"; comp="W"; render(); window.scrollTo({top:0}); }
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) go(b.dataset.open);});
document.getElementById("back").addEventListener("click",()=>go("dash"));
document.getElementById("controls").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.view!==undefined) view=b.dataset.view;
  else if(b.dataset.comp!==undefined) comp=b.dataset.comp;
  else if(b.dataset.div!==undefined) filt=b.dataset.div;
  else return;
  sel=null; render(); window.scrollTo({top:0});
});
document.getElementById("app").addEventListener("keydown",e=>{
  const c=e.target.closest("[data-open]"); if(!c) return;
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(c.dataset.open); }
});
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-open],[data-jump],[data-team]"); if(!b) return;
  if(b.dataset.open!==undefined){ go(b.dataset.open); return; }
  if(b.dataset.jump!==undefined){ const el=document.getElementById(b.dataset.jump); if(el) el.scrollIntoView(); return; }
  if(b.dataset.team!==undefined){ sel=b.dataset.team||null; render(); }
});
/* ---------- theme ---------- */
(function(){
  const KEY="pace-hub-theme", root=document.documentElement,
        btn=document.getElementById("theme"), label=document.getElementById("themelabel"),
        sun='<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>',
        moon='<path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2Z"/>';
  let theme="dark";
  try{ const s=localStorage.getItem(KEY); if(s==="light"||s==="dark") theme=s; }catch(e){}
  function apply(t){
    theme=t;
    root.setAttribute("data-theme",t);
    const toLight = t==="dark";
    label.textContent = toLight ? "Light" : "Dark";
    btn.querySelector("svg").innerHTML = toLight ? sun : moon;
    btn.setAttribute("aria-label", toLight ? "Switch to light mode" : "Switch to dark mode");
    btn.setAttribute("aria-pressed", String(t==="light"));
  }
  apply(theme);
  btn.addEventListener("click",()=>{
    apply(theme==="dark" ? "light" : "dark");
    try{ localStorage.setItem(KEY,theme); }catch(e){}
  });
})();
/* ---------- drag to scroll ---------- */
(function(){
  let el=null, sx=0, sy=0, sl=0, st=0, moved=false;
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="mouse"||e.button!==0) return;
    const t=e.target.closest(".drag-scroll"); if(!t) return;
    if(t.scrollWidth<=t.clientWidth && t.scrollHeight<=t.clientHeight) return;
    el=t; sx=e.clientX; sy=e.clientY; sl=t.scrollLeft; st=t.scrollTop; moved=false;
  });
  window.addEventListener("pointermove",e=>{
    if(!el) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)>5){ moved=true; el.classList.add("dragging"); }
    if(moved){ el.scrollLeft=sl-dx; el.scrollTop=st-dy; }
  });
  window.addEventListener("pointerup",()=>{
    if(!el) return;
    const t=el; el=null;
    requestAnimationFrame(()=>t.classList.remove("dragging"));
  });
  // a drag should not also count as a click on whatever tab it started on
  document.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);

  const strip=document.getElementById("tabs");
  strip.addEventListener("wheel",e=>{
    if(strip.scrollWidth>strip.clientWidth && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ strip.scrollLeft+=e.deltaY; e.preventDefault(); }
  },{passive:false});
  function fades(){
    const over=strip.scrollWidth>strip.clientWidth+1;
    strip.classList.toggle("more-l", over && strip.scrollLeft>2);
    strip.classList.toggle("more-r", over && strip.scrollLeft+strip.clientWidth<strip.scrollWidth-2);
  }
  strip.addEventListener("scroll",fades,{passive:true});
  window.addEventListener("resize",fades);
  // keep the active tab in view horizontally only, never scroll the page
  new MutationObserver(()=>{
    const on=strip.querySelector('[aria-pressed="true"]');
    if(on){ const l=on.offsetLeft, r=l+on.offsetWidth;
      if(l<strip.scrollLeft) strip.scrollLeft=l-24;
      else if(r>strip.scrollLeft+strip.clientWidth) strip.scrollLeft=r-strip.clientWidth+24; }
    fades();
  }).observe(strip,{childList:true});
  setTimeout(fades,0);
})();

/* ---------- data layer ----------
   fixtures.json is the canonical schedule and the only thing the Figma rollout reads.
   results.json is display-only and is what the scheduled fetcher writes.
   Both are fetched at load; the constants above are the baked-in last-known fallback,
   so a failed fetch degrades to the previous deploy rather than an empty page. */
let STAMP=null, STALE=[];

// venue-local wall time -> instant, via the zone's offset at that moment
function zonedToUTC(date,time,tz){
  if(!date||!time||!tz) return null;
  const naive=new Date(`${date}T${time}:00Z`);
  if(isNaN(naive)) return null;
  try{
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
      .formatToParts(naive).filter(x=>x.type!=="literal");
    const q=Object.fromEntries(parts.map(x=>[x.type,x.value]));
    const asTz=Date.UTC(+q.year,+q.month-1,+q.day,q.hour==="24"?0:+q.hour,+q.minute,+q.second);
    return new Date(naive.getTime()-(asTz-naive.getTime()));
  }catch(e){ return null; }
}
// a match is "started" 150 min past kick-off — long enough that a full-time score should exist
const STARTED_AFTER_MIN=150;
function startedFlag(date,time,tz){
  const ko=zonedToUTC(date,time,tz);
  return ko ? Date.now() > ko.getTime()+STARTED_AFTER_MIN*60000 : false;
}

function adapt(f,r){
  const res=r.results||{};
  const D={W:[],M:[]}, X={};
  for(const x of (f.fixtures.nzl||[])){
    if(x.bye){ D[x.comp].push({r:x.round,bye:x.bye}); continue; }
    const [y,m,d]=x.date.split("-"), hit=res[x.id];
    const started=startedFlag(x.date,x.ko,x.tz);
    D[x.comp].push({r:x.round,d:`${d}/${m}`,t:x.ko,h:x.home,a:x.away,v:x.venue,
      s:hit?hit.score:undefined,p:hit&&hit.pens?hit.pens:undefined,_started:started,_id:x.id});
    if(started&&!hit) STALE.push(x.id);
  }
  for(const [tid,list] of Object.entries(f.fixtures)){
    if(tid==="nzl") continue;
    X[tid]=list.map(x=>{
      const {id,tz,...rest}=x, hit=res[id];
      const started=startedFlag(x.date,x.ko,tz);
      if(started&&!hit) STALE.push(id);
      return {...rest,_id:id,_started:started,
        score:hit?hit.score:null,pens:hit&&hit.pens?hit.pens:null,
        note:hit&&hit.note?hit.note:(rest.note??null)};
    });
  }
  return {DATA:D,FIX:X,TOURNAMENTS:f.tournaments};
}

function showStamp(){
  const el=document.getElementById("stamp");
  if(!el||!STAMP) return;
  const d=new Date(STAMP);
  if(isNaN(d)) return;
  const when=d.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const zone=new Intl.DateTimeFormat(undefined,{timeZoneName:"short"})
    .formatToParts(d).find(x=>x.type==="timeZoneName");
  el.innerHTML=`Results current as of <b>${esc(when)}${zone?" "+esc(zone.value):""}</b>`
    +(STALE.length?` &middot; <span class="warn">${STALE.length} ${STALE.length===1?"match":"matches"} awaiting a result</span>`:"");
  el.hidden=false;
}

async function boot(){
  const bust="?v="+Date.now();
  try{
    const [f,r]=await Promise.all([
      fetch("fixtures.json"+bust).then(x=>{if(!x.ok)throw 0;return x.json()}),
      fetch("results.json"+bust).then(x=>{if(!x.ok)throw 0;return x.json()})
    ]);
    const next=adapt(f,r);
    DATA=next.DATA; FIX=next.FIX; TOURNAMENTS=next.TOURNAMENTS;
    sortTournaments();
    STAMP=r.updated;
  }catch(e){
    // keep the baked-in fallback; the page is still correct as of the last deploy
    console.warn("[hub] live data unavailable, using the copy baked into this deploy",e);
  }
  render();
  showStamp();
}
boot();
</script>
